<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Calculator</h1>
        <div class="calculator">
            <input type="text" id="display" class="display" readonly value="0">
            <div class="buttons">
                <button id="clear" class="btn clear">C</button>
                <button id="delete" class="btn clear">DEL</button>
                <button class="btn operator">/</button>
                <button class="btn operator">*</button>

                <button class="btn number">7</button>
                <button class="btn number">8</button>
                <button class="btn number">9</button>
                <button class="btn operator">-</button>

                <button class="btn number">4</button>
                <button class="btn number">5</button>
                <button class="btn number">6</button>
                <button class="btn operator">+</button>

                <button class="btn number">1</button>
                <button class="btn number">2</button>
                <button class="btn number">3</button>
                <button class="btn operator">.</button>

                <button class="btn number zero">0</button>
                <button id="equals" class="btn equals">=</button>
            </div>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
